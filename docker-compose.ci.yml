services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: queryfile-backend-ci
    volumes: []
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    ports: []
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_URL: /api
    image: queryfile-frontend-ci
    volumes: []
    working_dir: /app
    ports: []
