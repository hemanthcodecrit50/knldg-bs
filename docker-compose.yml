services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: ngdevops-backend

    env_file:
      - backend/.env

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend

    container_name: ngdevops-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend